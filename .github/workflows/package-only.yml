name: Package only
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Format and build worker
        run: |
          printf 'package buildinfo\nfunc init() { SourceSHA = "%s" }\n' "$GITHUB_SHA" > internal/buildinfo/stamp.go
          gofmt -w backend cmd internal
          git diff -- backend cmd internal > formatting.patch
          go build -trimpath -o /tmp/checkin-worker ./cmd/worker
      - uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: ignore
      - name: Build WASM
        run: |
          curl --fail --location --retry 3 https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb -o /tmp/tinygo.deb
          sudo dpkg -i /tmp/tinygo.deb
          id=$(jq -r .id plugin.json)
          mkdir -p release/wasm/$id/migrations
          tinygo build -target=wasip1 -buildmode=c-shared -o release/wasm/$id/backend.wasm ./backend
          python3 scripts/stamp-manifest.py
          cp backend/migrations/*.sql release/wasm/$id/migrations/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Package plugin
        run: |
          id=$(jq -r .id plugin.json)
          mkdir -p release/frontend/$id release/assets
          cp -R frontend/dist/. release/frontend/$id/
          tar -czf release/assets/backend-wasm.tar.gz -C release/wasm/$id backend.wasm
          tar -czf release/assets/frontend-dist.tar.gz -C frontend dist
          tar -czf release/assets/migrations.tar.gz -C backend migrations
          tar -czf release/assets/plugin-manifest.tar.gz -C release/wasm/$id plugin.json
          tar -czf release/assets/plugin-install.tar.gz -C release wasm frontend
          jq --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '. + {source_sha:$sha,action_run:$run,tests_run:false}' release/wasm/$id/plugin.json > release/assets/build-info.json
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish worker image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_SHA=${{ github.sha }}
          tags: ghcr.io/self-command/${{ github.event.repository.name }}-worker:sha-${{ github.sha }}
      - name: Publish package without test claims
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/self-command/${GITHUB_REPOSITORY#*/}-worker@$IMAGE_DIGEST" > release/assets/image-digest.txt
          (cd release/assets && sha256sum *.tar.gz *.json image-digest.txt > checksums.txt)
          printf '增加归档同步记录与服务器照片的永久清理入口、后台重试及设备清理通知。\n\nSource: %s\nWorker: %s\n本次仅构建与打包，按要求未运行测试。\n' "$GITHUB_SHA" "$IMAGE_DIGEST" > release-notes.md
          gh release create "v0.1.0-cleanup.${GITHUB_RUN_NUMBER}" release/assets/* --target "$GITHUB_SHA" --prerelease --title "v0.1.0-cleanup.${GITHUB_RUN_NUMBER}" --notes-file release-notes.md
