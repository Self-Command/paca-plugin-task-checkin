# Include inside the existing HTTPS task.spacedo.org server.
location ^~ /checkin-api/v1/ {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:18789;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 100s;
    proxy_request_buffering off;
    proxy_buffering off;
}
location ^~ /checkin/ {
    proxy_pass http://127.0.0.1:18789;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Stream responses without writing to a shared proxy temporary directory.
    proxy_buffering off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript;
}
# /internal/v1/ is deliberately not published by Nginx.
